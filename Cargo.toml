[package]
name = "nfs-walker"
version = "0.1.1"
edition = "2021"
authors = ["VAST Data"]
description = "High-performance NFS filesystem scanner with sharded Parquet output"
license = "MIT"
readme = "README.md"
keywords = ["nfs", "filesystem", "walker", "scanner", "parquet"]
categories = ["command-line-utilities", "filesystem"]

[features]
# Default = everything. The optional `server` feature exists so build
# matrices that strip the analytics dashboard (e.g. minimal static
# binaries) can opt out via --no-default-features, but a vanilla
# `cargo build` ships the whole CLI.
default = ["server"]
server = ["dep:datafusion", "dep:axum", "dep:tower-http", "dep:tokio", "dep:rust-embed", "dep:mime_guess"]

[dependencies]
# Global allocator. cargo-zigbuild's binary links to Zig's std SmpAllocator
# via its C-shim malloc, which returns NULL for ~30 KB requests once thread
# count crosses ~250. Rooting the global allocator at mimalloc bypasses that
# code path so every Rust allocation (Vec, hashbrown, parquet dict encoders)
# uses a real thread-aware allocator. See
# tasks/parquet-experiment-review.md for the 2026-05-15 segfault
# investigation.
#
# `default-features = false` is a no-op today (the `mimalloc` crate declares
# `default = []`) but is set explicitly so a future upstream change that
# adds default features (e.g. `secure`, which has a measurable perf
# impact) doesn't silently bleed into our binary. Caveat: only Rust-side
# allocations route through mimalloc; libnfs/libzstd/snappy still call
# into the system malloc (Zig SmpAllocator on musl). If the 250-thread
# crash resurfaces under different thread mixes, suspect C-side allocator
# pressure as the next root cause.
mimalloc = { version = "0.1", default-features = false }

# CLI parsing with derive macros
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Concurrency primitives - crossbeam is battle-tested
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress and display
indicatif = "0.17"
humansize = "2"
console = "0.15"

# Utilities
num_cpus = "1"
regex = "1"
chrono = "0.4"
ctrlc = "3"

# libc for NFS FFI types
libc = "0.2"

# Path→writer-shard routing hash (see src/walker/sharding.rs). musl
# builds need `-C target-feature=+aes,+sse2` (Dockerfile.musl sets it).
gxhash = "3"

# Parquet output: required (no longer feature-gated)
arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Analytics server (optional)
datafusion = { version = "46", optional = true, default-features = false, features = ["parquet"] }
axum = { version = "0.7", optional = true, features = ["json"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace"] }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "signal"] }


[build-dependencies]
# pkg-config is used to find libnfs and emit linker flags
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nfs-walker"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Same as release but keeps symbols + line tables for crash-symbolication.
# Used for the debuginfo musl build during the prod-segfault investigation.
[profile.release-debug]
inherits = "release"
strip = false
debug = "line-tables-only"

[profile.dev]
opt-level = 1
