[target.x86_64-unknown-linux-musl]
linker = "gcc"
# +aes,+sse2: gxhash needs AES + SSE2 intrinsics at compile time (no portable
# fallback). Kept here so a plain `cargo build --target ...-musl` works; the
# Dockerfile and Makefile pass the same flags via an env RUSTFLAGS, which
# overrides (does not merge with) these.
rustflags = ["-C", "target-feature=+crt-static,+aes,+sse2"]

# Explicit features here too, never target-cpu=native: cargo-zigbuild strips
# the glibc suffix, so the portable x86_64-unknown-linux-gnu.2.34 build
# resolves to this section. A binary tuned to the build host's CPU does not
# run on older CPUs and does not reproduce on another machine.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes,+sse2"]
